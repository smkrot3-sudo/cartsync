<meta name="description" content="רשימת קניות אחת, לכל המשפחה, בזמן אמת.">

<meta name="theme-color" content="#1C1A17" media="(prefers-color-scheme: dark)">

@font-face{font-family:"Varela Round";src:url(fonts/varela-round-hebrew-400-normal.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F;font-display:swap}
@font-face{font-family:"Varela Round";src:url(fonts/varela-round-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Suez One";src:url(fonts/suez-one-hebrew-400-normal.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F;font-display:swap}
@font-face{font-family:"Suez One";src:url(fonts/suez-one-latin-400-normal.woff2) format("woff2");font-display:swap}
</style>
<style>
/* Layout: one warm column, phone first — same system as tsaad-katan (CSS vars, .wrap/.card/.btn), different palette. */
:root{
  --bg:#FBF9F4; --surface:#FFFFFF; --soft:#FFF1E6; --fg:#2E2A24; --muted:#827A6E; --line:#EDE6DA;
  --accent:#FF9A61; --accent-ink:#FFFFFF; --accent-soft:#FFE7D6;
  --ok:#4CAF82; --ok-soft:#DCF3E7;
  --warn:#F2B134; --warn-soft:#FFF3D6;
  --danger:#E25C5C; --danger-soft:#FBE2E2;
  --shadow:0 6px 18px rgba(255,154,97,.14),0 1px 3px rgba(46,42,36,.06);
  --shade:rgba(46,42,36,.42);
  --display:"Suez One","Varela Round",system-ui,sans-serif;
  --body:"Varela Round",system-ui,"Segoe UI",Arial,sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1A17; --surface:#262320; --soft:#332A22; --fg:#F4EFE8; --muted:#B3A99C; --line:#3A352E;
  --accent:#FFA873; --accent-ink:#261405; --accent-soft:#4A3324;
  --ok:#6BD6A4; --ok-soft:#1F4433; --warn:#F2C45E; --warn-soft:#4A3C1A;
  --danger:#F08787; --danger-soft:#4A2626;
  --shadow:0 6px 18px rgba(0,0,0,.3); --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17; --surface:#262320; --soft:#332A22; --fg:#F4EFE8; --muted:#B3A99C; --line:#3A352E;
  --accent:#FFA873; --accent-ink:#261405; --accent-soft:#4A3324;
  --ok:#6BD6A4; --ok-soft:#1F4433; --warn:#F2C45E; --warn-soft:#4A3C1A;
  --danger:#F08787; --danger-soft:#4A2626;
  --shadow:0 6px 18px rgba(0,0,0,.3); --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;direction:rtl}
html[dir="ltr"] body,body[dir="ltr"]{direction:ltr}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(90px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.5rem}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
.e{font-family:var(--emoji);font-style:normal;line-height:1}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.2rem}
.brand .e{font-size:1.4rem}
.top-actions{display:flex;align-items:center;gap:6px}
.iconbtn{border:0;background:var(--surface);box-shadow:var(--shadow);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none;font-size:1.15rem}

.view{display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none!important}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 8px 4px}
.hero-emoji{font-size:2.6rem}
.sub{color:var(--muted);font-size:.95rem}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card input{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 13px;width:100%}
.card input:focus{border-color:var(--accent);outline:none}

.tabs{display:flex;gap:6px;background:var(--soft);border-radius:999px;padding:4px}
.tab{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 12px;color:var(--muted)}
.tab.active{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.msg{font-size:.88rem;border-radius:12px;padding:8px 10px}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}

.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:11px 18px;font-size:.96rem;white-space:nowrap;box-shadow:0 4px 12px rgba(255,154,97,.3)}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--accent-soft);box-shadow:none}
.btn.small{padding:7px 13px;font-size:.86rem}
.btn.wide{width:100%}
.btn.danger{background:var(--danger)}
.linkbtn{border:0;background:transparent;color:var(--accent);text-decoration:underline;padding:4px;font-size:.92rem}

.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.add input:focus{border-color:var(--accent);outline:none}
.add input.qty-input{flex:0 0 72px;min-width:0;text-align:center}

.empty{list-style:none;color:var(--muted);text-align:center;padding:26px 12px;border:2px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:8px;margin:0}

/* bottom sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40}
.sheet{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);max-height:85vh;overflow:auto;z-index:41;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet .close{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;color:var(--muted)}

.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;background:var(--fg);color:var(--bg);border-radius:14px;padding:11px 16px;text-align:center;z-index:50;box-shadow:var(--shadow)}
/* household bar, member avatars, item list grouped by category, pending/bought sections, invite sheet */
.hhbar{display:flex;align-items:center;gap:8px}
.hhname{display:flex;align-items:center;gap:4px;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:9px 14px;flex:1;min-width:0;overflow:hidden;text-align:start}
.hhname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.members{display:flex}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.85rem;font-weight:bold;border:2px solid var(--surface);margin-inline-start:-8px;flex:none}
.avatar:first-child{margin-inline-start:0}
.avatar.big{width:44px;height:44px;font-size:1.05rem;margin:0}
.role-chip{font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.role-chip.owner{background:var(--warn-soft);color:#9A6B10}
.role-chip.editor{background:var(--ok-soft);color:var(--ok)}
.role-chip.requester{background:var(--accent-soft);color:var(--accent)}
.role-chip.viewer{background:var(--soft);color:var(--muted)}

.group{margin-top:4px}
.group-h{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.85rem;padding:6px 4px;font-weight:bold}
.list{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}

.item{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);position:relative;touch-action:pan-y;transition:transform .18s ease,background-color .18s ease}
.item.swiping{transition:none}
.item.swipe-ok{background:var(--ok-soft)}
.item .handle{flex:none;color:var(--line);cursor:grab;font-size:1.1rem;padding:0 2px;touch-action:none}
.item.dragging{opacity:.5}
.item .qty-tag{flex:none;font-size:.78rem;color:var(--muted);background:var(--soft);border-radius:8px;padding:2px 7px;font-variant-numeric:tabular-nums}
.view-toggle-hint{text-align:center;font-size:.8rem;color:var(--muted);margin:-4px 0 2px}
.item .emo{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.2rem;flex:none;font-family:var(--emoji)}
.item .check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ok);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.item .check svg{opacity:0;transform:scale(.4);transition:all .2s cubic-bezier(.3,1.6,.5,1);width:15px;height:15px;stroke:white}
.item.done .check{background:var(--ok);border-color:var(--ok)}
.item.done .check svg{opacity:1;transform:scale(1)}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{color:var(--muted);text-decoration:line-through}
.item .who{font-size:.72rem;color:var(--muted);display:block}
.item .del{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:1rem}

.pending-box{background:var(--warn-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.pending-h{display:flex;align-items:center;gap:6px;font-size:1rem}
.pending-box .item{background:var(--surface)}
.pending-actions{display:flex;gap:6px;flex:none}
.pending-actions button{border:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1rem}
.pending-actions .ok-btn{background:var(--ok-soft);color:var(--ok)}
.pending-actions .no-btn{background:var(--danger-soft);color:var(--danger)}

.bought-box{display:flex;flex-direction:column;gap:6px}
.bought-box .item .emo{opacity:.6}

.auth input[hidden]{display:none}
.auth .actions-row{display:flex;justify-content:space-between;align-items:center}

.invite-code{font-family:var(--display);font-size:2rem;letter-spacing:.15em;text-align:center;background:var(--soft);border-radius:14px;padding:14px;direction:ltr}
.role-pick{display:flex;gap:6px;flex-wrap:wrap}
.role-pick button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem}
.role-pick button.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.member-row:last-child{border-bottom:0}
.member-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.offline-note{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:8px 12px;font-size:.85rem;text-align:center}

@media (max-width:360px){.avatar{width:26px;height:26px;font-size:.75rem}}
</style>
</head>
<body>
<div class="wrap" id="app">

  <header class="top">
    <div class="brand"><span class="e" id="brand-emoji">🛒</span><b id="brand-name">קניות ביחד</b></div>
    <div class="top-actions">
      <button class="iconbtn" id="lang-btn" aria-label="Language">🌐</button>
      <span id="acct-top"></span>
    </div>
  </header>

  <!-- ---------- auth screen ---------- -->
  <section class="view" id="view-auth">
    <div class="hero">
      <div class="hero-emoji e">🛒🥦🧺</div>
      <h1 id="auth-title">רשימת קניות אחת, לכל המשפחה</h1>
      <p class="sub" id="auth-sub">מוסיפים, מסמנים, ורואים את זה חי אצל כולם — גם כשכל אחד בחלק אחר של הסופר.</p>
    </div>
    <div class="card auth">
      <div class="tabs">
        <button class="tab active" data-authtab="login" id="tab-login">התחברות</button>
        <button class="tab" data-authtab="signup" id="tab-signup">הרשמה</button>
      </div>
      <input id="au-name" placeholder="השם שלך" autocomplete="given-name" hidden>
      <input id="au-email" type="email" placeholder="מייל" autocomplete="email" dir="ltr">
      <input id="au-pass" type="password" placeholder="סיסמה (לפחות 6 תווים)" autocomplete="current-password" dir="ltr">
      <div id="au-msg" class="msg" hidden></div>
      <button class="btn wide" id="au-go">להתחבר</button>
      <button class="linkbtn" id="au-forgot">שכחתי סיסמה</button>
    </div>
  </section>

  <!-- ---------- onboarding: create or join a household ---------- -->
  <section class="view" id="view-onboard" hidden>
    <div class="hero">
      <div class="hero-emoji e">🏠</div>
      <h1 id="onboard-title">למי קונים?</h1>
      <p class="sub" id="onboard-sub">יוצרים משק בית, או מצטרפים לאחד קיים עם קוד הזמנה.</p>
    </div>
    <div class="card">
      <h3 id="create-h">משק בית חדש</h3>
      <div class="add">
        <input id="hh-name" placeholder="לדוגמה: הבית שלנו">
        <button class="btn" id="hh-create">ליצור</button>
      </div>
    </div>
    <div class="card">
      <h3 id="join-h">יש לי קוד הזמנה</h3>
      <div class="add">
        <input id="hh-code" placeholder="קוד הזמנה" dir="ltr" maxlength="8">
        <button class="btn ghost" id="hh-join">להצטרף</button>
      </div>
      <div id="hh-msg" class="msg" hidden></div>
    </div>
  </section>

  <!-- ---------- main: the shared list ---------- -->
  <section class="view" id="view-main" hidden>
    <div class="hhbar">
      <button class="hhname" id="hh-switch"><b id="hh-name-lbl">…</b><span class="e">▾</span></button>
      <div class="members" id="members-strip"></div>
      <button class="iconbtn" id="view-toggle" aria-label="View" title="תצוגה">🗂️</button>
      <button class="iconbtn" id="invite-btn" aria-label="Invite">➕</button>
    </div>

    <div class="add">
      <input id="item-input" placeholder="להוסיף מוצר…" autocomplete="off">
      <input id="item-qty" class="qty-input" placeholder="כמות" autocomplete="off">
      <button class="btn" id="item-add">הוספה</button>
    </div>

    <div id="pending-box" class="pending-box" hidden>
      <h3 class="pending-h"><span class="e">🙋</span> <span id="pending-title">בקשות לאישור</span></h3>
      <ul class="list" id="pending-list"></ul>
    </div>

    <div id="groups"></div>

    <div id="bought-box" class="bought-box" hidden>
      <button class="linkbtn" id="bought-toggle">✅ <span id="bought-title">נקנה</span> (<span id="bought-count">0</span>)</button>
      <ul class="list" id="bought-list" hidden></ul>
    </div>

    <ul class="empty" id="empty-state" hidden>
      <li><span class="e" style="font-size:2.4rem">🧺</span><span id="empty-text">הרשימה ריקה. מה חסר בבית?</span></li>
    </ul>
  </section>

  <div class="shade" id="shade" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>

</div>

/* swipe left/right on an item toggles check, as an alternative to the check button */
function attachSwipe(container){
  container.querySelectorAll('.item[data-id]').forEach(el=>{
    let x0=null,y0=null,dx=0,active=false;
    el.addEventListener('pointerdown',e=>{
      if(e.target.closest('button,.handle')) return;
      x0=e.clientX; y0=e.clientY; dx=0; active=true; el.classList.add('swiping'); el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove',e=>{
      if(!active) return;
      dx=e.clientX-x0;
      if(Math.abs(e.clientY-y0)>40){ active=false; el.classList.remove('swiping'); el.style.transform=''; return; }
      el.style.transform=`translateX(${dx}px)`;
      el.classList.toggle('swipe-ok',Math.abs(dx)>70);
    });
    const end=()=>{
      if(!active) return;
      active=false; el.classList.remove('swiping');
      if(Math.abs(dx)>70) window.CS.on && window.CS.on.toggle && window.CS.on.toggle(el.dataset.id);
      el.style.transform=''; el.classList.remove('swipe-ok');
    };
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',end);
  });
}

/* drag-to-reorder, only active in flat view */
function attachDrag(listEl){
  if(!listEl) return;
  let dragEl=null;
  listEl.querySelectorAll('.item[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart',()=>{ dragEl=el; el.classList.add('dragging'); });
    el.addEventListener('dragend',()=>{
      el.classList.remove('dragging'); dragEl=null;
      const ids=[...listEl.querySelectorAll('.item[data-id]')].map(x=>x.dataset.id);
      window.CS.on && window.CS.on.reorder && window.CS.on.reorder(ids);
    });
    el.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragEl||dragEl===el) return;
      const r=el.getBoundingClientRect();
      const before = (e.clientY - r.top) < r.height/2;
      listEl.insertBefore(dragEl, before?el:el.nextSibling);
    });
  });
}

  const bought = items.filter(i=>i.status==='checked');

  $('bought-list').innerHTML = bought.map(i=>itemRow(i,'active')).join('');
  attachSwipe($('bought-list'));
}

function setAuthMode(mode){

  members=mrows||[]; membersById={}; members.forEach(m=>membersById[m.user_id]=m);
  role=(membersById[user.id]||{}).role||null;
  listId=lrows&&lrows[0]&&lrows[0].id;
  await ensureDisplayName(hh);
  $('hh-name-lbl').textContent=hrow.name;
  CS.renderMembers(members);
  CS.setScreen('main');
  if(listId) await fetchItems();
  subscribeRealtime();
}
async function refreshHousehold(){ if(household) await loadHousehold(household); }

async function createHousehold(){
  const name=$('hh-name').value.trim();
  const msg=$('hh-msg');
  if(!name){ msg.className='msg err'; msg.textContent=CS.t('needHhName'); msg.hidden=false; return; }
  const {data,error}=await sb.rpc('create_household',{p_name:name});
  if(error){ msg.className='msg err'; msg.textContent=CS.authErr(error); msg.hidden=false; return; }
  await loadHousehold(data);
}
async function joinHousehold(){
  const code=$('hh-code').value.trim();
  const msg=$('hh-msg');
  if(!code){ msg.className='msg err'; msg.textContent=CS.t('needCode'); msg.hidden=false; return; }
  const {data,error}=await sb.rpc('accept_invite',{p_code:code});
  if(error){ msg.className='msg err'; msg.textContent=CS.t('errInvite'); msg.hidden=false; return; }
  await loadHousehold(data);
}
$('hh-create').addEventListener('click',createHousehold);
$('hh-join').addEventListener('click',joinHousehold);

async function openHouseholdSwitcher(){
  const list=await listMyHouseholds();
  const t=CS.t;
  openSheet(sheetHead(t('switchHousehold'))+`<div class="card">
    ${list.map(h=>`<button class="btn ghost wide" data-hh="${h.id}">🏠 ${esc(h.name)}</button>`).join('')}
    <button class="btn wide" id="hh-new">➕ ${esc(t('createHh'))}</button>
  </div>`);
  $('sheet').querySelectorAll('[data-hh]').forEach(b=>b.onclick=async()=>{ closeSheet(); await loadHousehold(b.dataset.hh); });
  $('hh-new').onclick=()=>{ closeSheet(); CS.setScreen('onboard'); };
}
$('hh-switch').addEventListener('click',openHouseholdSwitcher);

/* ---------- invites ---------- */
function openInviteSheet(){
  const t=CS.t;
  let pickedRole='editor';
  const draw=()=>openSheet(sheetHead(t('invite'))+`<div class="card">
      <p class="sub">${esc(t('inviteSub'))}</p>
      <p>${esc(t('inviteRole'))}</p>
      <div class="role-pick">
        ${['editor','requester','viewer'].map(r=>`<button data-role="${r}" class="${r===pickedRole?'active':''}">${esc(t('role'+r[0].toUpperCase()+r.slice(1)))}</button>`).join('')}
      </div>
      <button class="btn wide" id="inv-go">${esc(t('invite'))}</button>
      <div id="inv-code-box"></div>
    </div>`);
  draw();
  $('sheet').addEventListener('click',e=>{
    const rb=e.target.closest('[data-role]'); if(rb){ pickedRole=rb.dataset.role; draw(); }
  });
  document.getElementById('inv-go').onclick=async()=>{
    const {data,error}=await sb.rpc('create_invite',{p_household:household,p_role:pickedRole});
    if(error){ toast(CS.authErr(error)); return; }
    document.getElementById('inv-code-box').innerHTML=`<div class="invite-code">${esc(data)}</div>
      <button class="btn ghost wide" id="inv-copy">📋 ${esc(t('inviteCopy'))}</button>`;
    document.getElementById('inv-copy').onclick=()=>{
      navigator.clipboard&&navigator.clipboard.writeText(data).catch(()=>{});
      toast(t('inviteCopied'));
    };
  };
}
$('invite-btn').addEventListener('click',openInviteSheet);

/* ---------- items ---------- */
function decorate(list){
  return list.map(i=>({...i,
    checked_by_name: i.checked_by&&membersById[i.checked_by]?membersById[i.checked_by].display_name:'',
    requested_by_name: i.created_by&&membersById[i.created_by]?membersById[i.created_by].display_name:'',
  }));
}
function paintItems(){ CS.renderGroups(decorate(items)); }
async function fetchItems(){
  const {data,error}=await sb.from('list_items').select('*').eq('list_id',listId).order('position');
  if(error){ console.warn(error); return; }
  items=data||[];
  paintItems();
}
async function aiCategorize(text){
  try{
    const {data,error}=await sb.functions.invoke('categorize',{body:{text}});
    if(error||!data||!data.results||!data.results[0]) return null;
    const r=data.results[0];
    return {cat:r.category,emoji:r.emoji};
  }catch(e){ return null; }
}
async function addItem(){
  const input=$('item-input'), qtyInput=$('item-qty');
  const text=input.value.trim();
  const qty=qtyInput.value.trim();
  if(!text||!listId) return;
  input.value=''; qtyInput.value='';
  let g=CS.guess(text);
  if(g.cat==='other'){ const ai=await aiCategorize(text); if(ai) g=ai; } // local dictionary has no match: ask the AI edge function instead of settling for "other"
  const {error}=await sb.from('list_items').insert({
    list_id:listId, household_id:household, text, category:g.cat, emoji:g.emoji, qty:qty||null, created_by:user.id,
    position: Date.now(),
  });
  if(error){ toast(CS.authErr(error)); return; }
  toast(role==='requester'?CS.t('itemRequested'):CS.t('itemAdded'));
}
$('item-add').addEventListener('click',addItem);
$('item-input').addEventListener('keydown',e=>{ if(e.key==='Enter') addItem(); });
$('item-qty').addEventListener('keydown',e=>{ if(e.key==='Enter') addItem(); });

async function reorderItems(ids){
  // cheap re-stripe of positions for the dragged list — small household lists, one update per row is fine
  await Promise.all(ids.map((id,i)=>sb.from('list_items').update({position:(i+1)*1000}).eq('id',id)));
}

async function toggleItem(id){
  const it=items.find(i=>i.id===id); if(!it) return;
  if(it.status==='checked') await sb.from('list_items').update({status:'active',checked_by:null,checked_at:null}).eq('id',id);
  else await sb.from('list_items').update({status:'checked',checked_by:user.id,checked_at:new Date().toISOString()}).eq('id',id);
}
async function delItem(id){ await sb.from('list_items').delete().eq('id',id); }
async function approveItem(id){ await sb.from('list_items').update({status:'active'}).eq('id',id); toast(CS.t('itemApproved')); }
async function rejectItem(id){ await sb.from('list_items').delete().eq('id',id); }
window.CS.on={toggle:toggleItem, reorder:reorderItems};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]'); if(!b) return;
  const id=b.dataset.id, action=b.dataset.action;
  if(action==='toggle') toggleItem(id);
  else if(action==='del') delItem(id);
  else if(action==='approve') approveItem(id);
  else if(action==='reject') rejectItem(id);
});

/* ---------- realtime ---------- */
function subscribeRealtime(){
  if(channel){ sb.removeChannel(channel); channel=null; }
  if(!listId) return;
  channel=sb.channel('list:'+listId)
    .on('postgres_changes',{event:'*',schema:'public',table:'list_items',filter:'list_id=eq.'+listId},payload=>{
      if(payload.eventType==='INSERT') items.push(payload.new);
      else if(payload.eventType==='UPDATE') items=items.map(i=>i.id===payload.new.id?payload.new:i);
      else if(payload.eventType==='DELETE') items=items.filter(i=>i.id!==payload.old.id);
      paintItems();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'household_members',filter:'household_id=eq.'+household},()=>{
      refreshHousehold();
    })
    .subscribe();
}
addEventListener('online',()=>{ online=true; refreshHousehold(); });
addEventListener('offline',()=>{ online=false; });

/* ---------- boot ---------- */
async function onUser(u){
  user=u;
  renderAccount();
  if(!u){ household=null; listId=null; items=[]; CS.setScreen('auth'); return; }
  const list=await listMyHouseholds();
  if(!list.length){ CS.setScreen('onboard'); return; }
  let last=null; try{ last=localStorage.getItem('cs-last-hh'); }catch(e){}
  const pick=(last&&list.find(h=>h.id===last))||list[0];
  await loadHousehold(pick.id);
}
sb.auth.onAuthStateChange((event,session)=>{ setTimeout(()=>onUser(session?session.user:null),0); });

window.CS.rerenderMain=paintItems;
})();
</script>

if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
