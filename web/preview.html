<title>קניות ביחד</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Varela+Round&display=swap">
<style>
/* Layout: one teal/coral column, phone first — same system as tsaad-katan (CSS vars, .wrap/.card/.btn), own duotone palette. */
:root{
  --bg:#F3FBFA; --surface:#FFFFFF; --soft:#E3F6F3; --fg:#1E2E2C; --muted:#6C8B86; --line:#DAEEEA;
  --accent:#1FA998; --accent-ink:#FFFFFF; --accent-soft:#D2F2EC;
  --coral:#FF6F5E; --coral-ink:#FFFFFF; --coral-soft:#FFE1DB;
  --gold:#B4890F; --gold-soft:#FBEFD2;
  --ok:#3FAE6A; --ok-soft:#DDF2E4;
  --warn:var(--coral); --warn-soft:var(--coral-soft);
  --danger:#E04F4F; --danger-soft:#FAE1E1;
  --shadow:0 6px 18px rgba(31,169,152,.14),0 1px 3px rgba(30,46,44,.06);
  --shade:rgba(20,36,34,.42);
  --display:"Suez One","Varela Round",system-ui,sans-serif;
  --body:"Varela Round",system-ui,"Segoe UI",Arial,sans-serif;
  --marker:"Rubik Wet Paint",var(--display);
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  --r:18px;
  --rule:rgba(31,169,152,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#102321; --surface:#17302C; --soft:#1C3B35; --fg:#E8F6F3; --muted:#8FB3AC; --line:#274742;
  --accent:#3FD2BE; --accent-ink:#062420; --accent-soft:#1C4A42;
  --coral:#FF8A79; --coral-ink:#3A1410; --coral-soft:#4A2a22;
  --gold:#E4C260; --gold-soft:#4A3C1A;
  --ok:#5FD08A; --ok-soft:#1E3F2C; --warn:var(--coral); --warn-soft:var(--coral-soft);
  --danger:#F08787; --danger-soft:#4A2626;
  --rule:rgba(255,255,255,.055);
  --shadow:0 6px 18px rgba(0,0,0,.3); --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#102321; --surface:#17302C; --soft:#1C3B35; --fg:#E8F6F3; --muted:#8FB3AC; --line:#274742;
  --accent:#3FD2BE; --accent-ink:#062420; --accent-soft:#1C4A42;
  --coral:#FF8A79; --coral-ink:#3A1410; --coral-soft:#4A2a22;
  --gold:#E4C260; --gold-soft:#4A3C1A;
  --rule:rgba(255,255,255,.055);
  --ok:#5FD08A; --ok-soft:#1E3F2C; --warn:var(--coral); --warn-soft:var(--coral-soft);
  --danger:#F08787; --danger-soft:#4A2626;
  --shadow:0 6px 18px rgba(0,0,0,.3); --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;direction:rtl}
html[dir="ltr"] body,body[dir="ltr"]{direction:ltr}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(90px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.5rem}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
.e{font-family:var(--emoji);font-style:normal;line-height:1}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.2rem}
.brand .e{font-size:1.4rem}
.top-actions{display:flex;align-items:center;gap:6px}
.iconbtn{border:0;background:var(--surface);box-shadow:var(--shadow);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none;font-size:1.15rem}

.view{display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none!important}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 8px 4px}
.hero-emoji{font-size:2.6rem}
.sub{color:var(--muted);font-size:.95rem}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card input{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 13px;width:100%}
.card input:focus{border-color:var(--accent);outline:none}

.tabs{display:flex;gap:6px;background:var(--soft);border-radius:999px;padding:4px}
.tab{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 12px;color:var(--muted)}
.tab.active{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.msg{font-size:.88rem;border-radius:12px;padding:8px 10px}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}

.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:11px 18px;font-size:.96rem;white-space:nowrap;box-shadow:0 4px 12px rgba(31,169,152,.3)}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--accent-soft);box-shadow:none}
.btn.small{padding:7px 13px;font-size:.86rem}
.btn.wide{width:100%}
.btn.danger{background:var(--danger)}
.linkbtn{border:0;background:transparent;color:var(--accent);text-decoration:underline;padding:4px;font-size:.92rem}

.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.add input:focus{border-color:var(--accent);outline:none}
.add input.qty-input{flex:0 0 72px;min-width:0;text-align:center}

.empty{list-style:none;color:var(--muted);text-align:center;padding:26px 12px;border:2px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:8px;margin:0}

/* bottom sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40}
.sheet{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);max-height:85vh;overflow:auto;z-index:41;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet .close{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;color:var(--muted)}

.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;background:var(--fg);color:var(--bg);border-radius:14px;padding:11px 16px;text-align:center;z-index:50;box-shadow:var(--shadow)}

.version-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 8px calc(14px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.78rem;flex-wrap:wrap}
/* household bar, member avatars, item list grouped by category, pending/bought sections, invite sheet */
.hhbar{display:flex;align-items:center;gap:8px}
.hhname{display:flex;align-items:center;gap:4px;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:9px 14px;flex:1;min-width:0;overflow:hidden;text-align:start}
.hhname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.members{display:flex}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.85rem;font-weight:bold;border:2px solid var(--surface);margin-inline-start:-8px;flex:none}
.avatar:first-child{margin-inline-start:0}
.avatar.big{width:44px;height:44px;font-size:1.05rem;margin:0}
.role-chip{font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.role-chip.owner{background:var(--gold-soft);color:var(--gold)}
.role-chip.editor{background:var(--ok-soft);color:var(--ok)}
.role-chip.requester{background:var(--accent-soft);color:var(--accent)}
.role-chip.viewer{background:var(--soft);color:var(--muted)}

/* ---------- list card: a quiet nod to a paper pad (ruled lines + a thin accent edge), nothing literal ---------- */
.note{position:relative;background:var(--surface);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.note::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;border-start-start-radius:var(--r);border-end-start-radius:var(--r);background:var(--accent-edge,var(--line))}

.note-main{--accent-edge:var(--accent);background-image:repeating-linear-gradient(var(--surface) 0 29px,var(--rule) 29px 30px)}
.note-sticky{--accent-edge:var(--coral)}
.note-small{--accent-edge:var(--line);opacity:.82}

.group{margin-top:2px}
.group+.group{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.group-h{display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:.92rem;letter-spacing:.02em;color:var(--muted);padding:2px 2px 8px;font-weight:400}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}

.item{display:flex;align-items:center;gap:10px;background:transparent;border-radius:10px;padding:9px 4px;position:relative;touch-action:pan-y;transition:transform .18s ease,background-color .18s ease}
.item.swiping{transition:none}
.item.swipe-ok{background:var(--ok-soft)}
.item .handle{flex:none;color:var(--muted);cursor:grab;font-size:1.1rem;padding:0 2px;touch-action:none}
.item.dragging{opacity:.5}
.item .qty-tag{flex:none;font-size:.76rem;color:var(--muted);background:var(--soft);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.item .emo{width:30px;height:30px;display:grid;place-items:center;font-size:1.25rem;flex:none;font-family:var(--emoji)}
.item .check{width:23px;height:23px;border:2px solid var(--line);background:transparent;border-radius:7px;flex:none;display:grid;place-items:center;padding:0;transition:border-color .15s ease}
.item .check svg{opacity:0;transform:scale(.5);transition:all .2s cubic-bezier(.3,1.6,.5,1);width:14px;height:14px;stroke:#fff;stroke-width:4}
.item.done .check{border-color:var(--ok);background:var(--ok)}
.item.done .check svg{opacity:1;transform:scale(1)}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:1rem}
.item.done .t{color:var(--muted);text-decoration:line-through;text-decoration-style:wavy;text-decoration-color:var(--ok);text-decoration-thickness:1.3px}
.item .who{font-size:.72rem;color:var(--muted);display:block}
.item .del{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.95rem}

.pending-h{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:1.02rem;font-weight:400;margin:0 0 8px}
.pending-actions{display:flex;gap:6px;flex:none}
.pending-actions button{border:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.95rem}
.pending-actions .ok-btn{background:var(--ok-soft);color:var(--ok)}
.pending-actions .no-btn{background:var(--danger-soft);color:var(--danger)}

.bought-box .item .emo{opacity:.55}
.bought-box .linkbtn{font-size:.95rem;text-decoration:none;color:var(--muted)}

.auth input[hidden]{display:none}
.auth .actions-row{display:flex;justify-content:space-between;align-items:center}

.invite-code{font-family:var(--display);font-size:2rem;letter-spacing:.15em;text-align:center;background:var(--soft);border-radius:14px;padding:14px;direction:ltr}
.role-pick{display:flex;gap:6px;flex-wrap:wrap}
.role-pick button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem}
.role-pick button.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.member-row:last-child{border-bottom:0}
.member-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.offline-note{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:8px 12px;font-size:.85rem;text-align:center}

@media (max-width:360px){.avatar{width:26px;height:26px;font-size:.75rem}}
</style>
<div class="wrap" id="app">

  <header class="top">
    <div class="brand"><span class="e" id="brand-emoji">🛒</span><b id="brand-name">קניות ביחד</b></div>
    <div class="top-actions">
      <button class="iconbtn" id="lang-btn" aria-label="Language">🌐</button>
      <span id="acct-top"></span>
    </div>
  </header>

  <!-- ---------- auth screen ---------- -->
  <section class="view" id="view-auth">
    <div class="hero">
      <div class="hero-emoji e">🛒🥦🧺</div>
      <h1 id="auth-title">רשימת קניות אחת, לכל המשפחה</h1>
      <p class="sub" id="auth-sub">מוסיפים, מסמנים, ורואים את זה חי אצל כולם — גם כשכל אחד בחלק אחר של הסופר.</p>
    </div>
    <div class="card auth">
      <div class="tabs">
        <button class="tab active" data-authtab="login" id="tab-login">התחברות</button>
        <button class="tab" data-authtab="signup" id="tab-signup">הרשמה</button>
      </div>
      <input id="au-name" placeholder="השם שלך" autocomplete="given-name" hidden>
      <input id="au-email" type="email" placeholder="מייל" autocomplete="email" dir="ltr">
      <input id="au-pass" type="password" placeholder="סיסמה (לפחות 6 תווים)" autocomplete="current-password" dir="ltr">
      <div id="au-msg" class="msg" hidden></div>
      <button class="btn wide" id="au-go">להתחבר</button>
      <button class="linkbtn" id="au-forgot">שכחתי סיסמה</button>
    </div>
  </section>

  <!-- ---------- onboarding: create or join a household ---------- -->
  <section class="view" id="view-onboard" hidden>
    <div class="hero">
      <div class="hero-emoji e">🏠</div>
      <h1 id="onboard-title">למי קונים?</h1>
      <p class="sub" id="onboard-sub">יוצרים משק בית, או מצטרפים לאחד קיים עם קוד הזמנה.</p>
    </div>
    <div class="card">
      <h3 id="create-h">משק בית חדש</h3>
      <div class="add">
        <input id="hh-name" placeholder="לדוגמה: הבית שלנו">
        <button class="btn" id="hh-create">ליצור</button>
      </div>
    </div>
    <div class="card">
      <h3 id="join-h">יש לי קוד הזמנה</h3>
      <div class="add">
        <input id="hh-code" placeholder="קוד הזמנה" dir="ltr" maxlength="8">
        <button class="btn ghost" id="hh-join">להצטרף</button>
      </div>
      <div id="hh-msg" class="msg" hidden></div>
    </div>
  </section>

  <!-- ---------- main: the shared list ---------- -->
  <section class="view" id="view-main" hidden>
    <div id="offline-note" class="offline-note" hidden></div>
    <div class="hhbar">
      <button class="hhname" id="hh-switch"><b id="hh-name-lbl">…</b><span class="e">▾</span></button>
      <div class="members" id="members-strip"></div>
      <button class="iconbtn" id="view-toggle" aria-label="View" title="תצוגה">🗂️</button>
      <button class="iconbtn" id="invite-btn" aria-label="Invite">➕</button>
    </div>

    <div class="add">
      <input id="item-input" placeholder="להוסיף מוצר…" autocomplete="off">
      <input id="item-qty" class="qty-input" placeholder="כמות" autocomplete="off">
      <button class="btn" id="item-add">הוספה</button>
    </div>

    <div id="pending-box" class="note note-sticky" hidden>
      <h3 class="pending-h"><span class="e">🙋</span> <span id="pending-title">בקשות לאישור</span></h3>
      <ul class="list" id="pending-list"></ul>
    </div>

    <div class="note note-main">
      <div id="groups"></div>
      <ul class="empty" id="empty-state" hidden>
        <li><span class="e" style="font-size:2.4rem">🧺</span><span id="empty-text">הרשימה ריקה. מה חסר בבית?</span></li>
      </ul>
    </div>

    <div id="bought-box" class="note note-small" hidden>
      <button class="linkbtn" id="bought-toggle">✅ <span id="bought-title">נקנה</span> (<span id="bought-count">0</span>)</button>
      <ul class="list" id="bought-list" hidden></ul>
    </div>
  </section>

  <div class="shade" id="shade" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <footer class="version-bar">
    <span id="version-label">…</span>
    <button class="btn small" id="update-btn" hidden>🔄 לעדכן</button>
  </footer>

</div>

(function(){
  window.CS = window.CS || {};
  let lang = 'he';
  try{
    const saved = localStorage.getItem('cs-lang');
    lang = saved || ((navigator.language||'').toLowerCase().startsWith('en') ? 'en' : 'he');
  }catch(e){}
  if(lang!=='he'&&lang!=='en') lang='he';

  function apply(){
    document.documentElement.lang = lang;
    document.documentElement.dir = lang==='he' ? 'rtl' : 'ltr';
  }
  function t(key){ return (STRINGS[lang]&&STRINGS[lang][key]) || STRINGS.he[key] || key; }
  function authErr(e){
    const msg = (e&&e.message) || String(e);
    const table = AUTH_ERR[lang]||AUTH_ERR.he;
    const key = Object.keys(table).find(k=>msg.includes(k));
    return key ? table[key] : (STRINGS[lang]||STRINGS.he).errGeneric;
  }
  function setLang(l){ lang = l==='en'?'en':'he'; try{localStorage.setItem('cs-lang',lang)}catch(e){} apply(); if(window.CS.render) window.CS.render(); }
  apply();
  Object.assign(window.CS,{t,lang:()=>lang,setLang,authErr,CATS,CAT_ORDER});

<script>
/* Pure UI layer: rendering, local category/emoji guessing, sheets, toast. No network here — cloud.js drives state and wires the real actions via CS.on.*. */
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- local item -> category/emoji guesser (works with zero network; the AI edge function can refine this later) ---------- */
const DICT = [
  [['חלב','milk'],'dairy','🥛'], [['גבינה','cheese'],'dairy','🧀'], [['ביצים','egg'],'dairy','🥚'],
  [['יוגורט','yogurt','yoghurt'],'dairy','🥣'], [['חמאה','butter'],'dairy','🧈'], [['שמנת','cream'],'dairy','🥛'],
  [['קוטג','cottage'],'dairy','🧀'],
  [['לחם','bread'],'bakery','🍞'], [['חלה','challah'],'bakery','🍞'], [['פיתה','pita'],'bakery','🫓'],
  [['בורקס','croissant','קרואסון'],'bakery','🥐'], [['עוגה','cake'],'bakery','🍰'], [['בייגל','bagel'],'bakery','🥯'],
  [['עגבני','tomato'],'produce','🍅'], [['מלפפון','cucumber'],'produce','🥒'], [['בננה','banana'],'produce','🍌'],
  [['תפוח אדמה','תפוחי אדמה','potato'],'produce','🥔'], [['תפוח','apple'],'produce','🍎'], [['תפוז','orange'],'produce','🍊'],
  [['תות','strawberr'],'produce','🍓'], [['אבוקדו','avocado'],'produce','🥑'], [['בצל','onion'],'produce','🧅'],
  [['שום','garlic'],'produce','🧄'], [['גזר','carrot'],'produce','🥕'], [['פלפל','pepper'],'produce','🫑'],
  [['חסה','lettuce'],'produce','🥬'], [['ברוקולי','broccoli'],'produce','🥦'], [['לימון','lemon'],'produce','🍋'],
  [['ענבים','grape'],'produce','🍇'], [['אבטיח','watermelon'],'produce','🍉'], [['מנגו','mango'],'produce','🥭'],
  [['עוף','chicken'],'meat','🍗'], [['הודו','turkey'],'meat','🦃'], [['בשר','beef','meat'],'meat','🥩'],
  [['דג','fish','סלמון','salmon','טונה','tuna'],'meat','🐟'], [['נקניק','sausage','hotdog'],'meat','🌭'],
  [['המבורגר','burger'],'meat','🍔'],
  [['פסטה','pasta','ספגטי','spaghetti'],'pantry','🍝'], [['אורז','rice'],'pantry','🍚'], [['קמח','flour'],'pantry','🌾'],
  [['סוכר','sugar'],'pantry','🍬'], [['שמן','oil'],'pantry','🫒'], [['קטשופ','ketchup'],'pantry','🍅'],
  [['חומוס','hummus'],'pantry','🧆'], [['טחינה','tahini'],'pantry','🥫'], [['קורנפלקס','cereal'],'pantry','🥣'],
  [['מלח','salt'],'pantry','🧂'], [['טונה','tuna'],'pantry','🥫'], [['שימורים','canned'],'pantry','🥫'],
  [['קפה','coffee'],'beverages','☕'], [['תה','tea'],'beverages','🍵'], [['מים','water'],'beverages','💧'],
  [['מיץ','juice'],'beverages','🧃'], [['קולה','cola','סודה','soda'],'beverages','🥤'], [['בירה','beer'],'beverages','🍺'],
  [['יין','wine'],'beverages','🍷'],
  [['שוקולד','chocolate'],'snacks','🍫'], [['חטיף','chips','צ׳יפס'],'snacks','🍿'], [['עוגי','cookie','biscuit'],'snacks','🍪'],
  [['גומי','candy','ממתק'],'snacks','🍬'], [['בוטנים','peanut','אגוז','nuts'],'snacks','🥜'],
  [['גלידה','ice cream'],'frozen','🍦'], [['קפוא','frozen'],'frozen','🧊'], [['פיצה','pizza'],'frozen','🍕'],
  [['סבון','soap'],'household','🧼'], [['נייר טואלט','toilet paper'],'household','🧻'], [['מגבונים','wipes'],'household','🧻'],
  [['אקונומיקה','bleach','נוזל כלים','dish soap'],'household','🧽'], [['שקיות','bags'],'household','🛍️'],
  [['מטהר','detergent','אבקת כביסה','laundry'],'household','🧴'],
  [['שמפו','shampoo'],'care','🧴'], [['משחת שיניים','toothpaste'],'care','🪥'], [['דאודורנט','deodorant'],'care','🧴'],
  [['סבון גוף','body wash'],'care','🧴'],
  [['חיתול','diaper'],'baby','🍼'], [['מטרנה','similac','תמ״ל','formula'],'baby','🍼'],
  [['מזון לכלב','dog food'],'pet','🐶'], [['מזון לחתול','cat food'],'pet','🐱'], [['חול לחתול','litter'],'pet','🐾'],
];
function guess(text){
  const n = (text||'').trim().toLowerCase();
  if(!n) return {cat:'other',emoji:CS.CATS.other.emoji};
  for(const [keys,cat,emoji] of DICT){
    if(keys.some(k=>n.includes(k.toLowerCase()))) return {cat,emoji};
  }
  return {cat:'other',emoji:CS.CATS.other.emoji};
}

/* ---------- sheet / toast ---------- */
function openSheet(html){ $('sheet').innerHTML = html; $('sheet').hidden=false; $('shade').hidden=false; }
function closeSheet(){ $('sheet').hidden=true; $('shade').hidden=true; $('sheet').innerHTML=''; }
function sheetHead(title){ return `<div class="sheet-head"><h2>${esc(title)}</h2><button class="close" data-act="sheet-close">✕</button></div>`; }
let toastTimer=null;
function toast(msg){ const el=$('toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2600); }
$('shade').addEventListener('click',closeSheet);
document.addEventListener('click',e=>{ if(e.target.closest('[data-act="sheet-close"]')) closeSheet(); });

/* ---------- screens ---------- */
function setScreen(name){
  ['auth','onboard','main'].forEach(s=>{ $('view-'+s).hidden = s!==name; });
}

/* ---------- i18n paint ---------- */
function paintStrings(){
  const t = CS.t;
  $('brand-name').textContent = t('appName');
  $('auth-title').textContent = t('authHero');
  $('auth-sub').textContent = t('authSub');
  $('tab-login').textContent = t('login');
  $('tab-signup').textContent = t('signup');
  $('au-email').placeholder = t('email');
  $('au-pass').placeholder = t('password');
  $('au-name').placeholder = t('name');
  $('au-forgot').textContent = t('forgot');
  $('onboard-title').textContent = t('onboardTitle');
  $('onboard-sub').textContent = t('onboardSub');
  $('create-h').textContent = t('createHh');
  $('hh-name').placeholder = t('hhNamePh');
  $('hh-create').textContent = t('create');
  $('join-h').textContent = t('joinHh');
  $('hh-code').placeholder = t('codePh');
  $('hh-join').textContent = t('join');
  $('item-input').placeholder = t('itemPh');
  $('item-qty').placeholder = t('qtyPh');
  $('item-add').textContent = t('add');
  $('pending-title').textContent = t('pendingTitle');
  $('bought-title').textContent = t('boughtTitle');
  $('empty-text').textContent = t('emptyList');
  const authGoMode = $('au-go').dataset.mode || 'login';
  $('au-go').textContent = authGoMode==='signup'?t('signupGo'):authGoMode==='reset'?t('resetGo'):t('loginGo');
}

/* ---------- member avatars ---------- */
function initials(nameOrEmail){
  const s = (nameOrEmail||'?').trim();
  return (s[0]||'?').toUpperCase();
}
function renderMembers(members){
  $('members-strip').innerHTML = (members||[]).slice(0,5).map(m=>
    `<span class="avatar" title="${esc(m.display_name||m.email||'')}">${esc(initials(m.display_name||m.email))}</span>`).join('');
}

/* ---------- view mode: grouped-by-category vs flat+draggable ---------- */
let viewMode='grouped';
try{ viewMode = localStorage.getItem('cs-view')||'grouped'; }catch(e){}
function paintViewToggle(){ $('view-toggle').textContent = viewMode==='flat'?'📋':'🗂️'; }
function setViewMode(m){ viewMode=m; try{localStorage.setItem('cs-view',m)}catch(e){} paintViewToggle(); if(window.CS.rerenderMain) window.CS.rerenderMain(); }
$('view-toggle').addEventListener('click',()=>setViewMode(viewMode==='flat'?'grouped':'flat'));
paintViewToggle();

/* ---------- item rows ---------- */
function itemRow(item, mode, draggable){
  const cat = CS.CATS[item.category]||CS.CATS.other;
  const who = item.checked_by_name ? `<span class="who">${esc(item.checked_by_name)}</span>` : '';
  const qty = item.qty ? `<span class="qty-tag">${esc(item.qty)}</span>` : '';
  if(mode==='pending'){
    return `<li class="item" data-id="${item.id}">
      <span class="emo e">${esc(item.emoji||cat.emoji)}</span>
      <span class="t">${esc(item.text)}<span class="who">${esc(item.requested_by_name||'')}</span></span>
      ${qty}
      <span class="pending-actions">
        <button class="ok-btn" data-action="approve" data-id="${item.id}" aria-label="approve">✓</button>
        <button class="no-btn" data-action="reject" data-id="${item.id}" aria-label="reject">✕</button>
      </span>
    </li>`;
  }
  const done = item.status==='checked';
  const handle = draggable ? `<span class="handle">⋮⋮</span>` : '';
  return `<li class="item ${done?'done':''}" data-id="${item.id}" ${draggable?'draggable="true"':''}>
    ${handle}
    <button class="check" data-action="toggle" data-id="${item.id}" aria-label="check">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="emo e">${esc(item.emoji||cat.emoji)}</span>
    <span class="t">${esc(item.text)}${who}</span>
    ${qty}
    <button class="del" data-action="del" data-id="${item.id}" aria-label="delete">🗑️</button>
  </li>`;
}

/* swipe left/right on an item toggles check, as an alternative to the check button */
function attachSwipe(container){
  container.querySelectorAll('.item[data-id]').forEach(el=>{
    let x0=null,y0=null,dx=0,active=false;
    el.addEventListener('pointerdown',e=>{
      if(e.target.closest('button,.handle')) return;
      x0=e.clientX; y0=e.clientY; dx=0; active=true; el.classList.add('swiping'); el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove',e=>{
      if(!active) return;
      dx=e.clientX-x0;
      if(Math.abs(e.clientY-y0)>40){ active=false; el.classList.remove('swiping'); el.style.transform=''; return; }
      el.style.transform=`translateX(${dx}px)`;
      el.classList.toggle('swipe-ok',Math.abs(dx)>70);
    });
    const end=()=>{
      if(!active) return;
      active=false; el.classList.remove('swiping');
      if(Math.abs(dx)>70) window.CS.on && window.CS.on.toggle && window.CS.on.toggle(el.dataset.id);
      el.style.transform=''; el.classList.remove('swipe-ok');
    };
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',end);
  });
}

/* drag-to-reorder, only active in flat view */
function attachDrag(listEl){
  if(!listEl) return;
  let dragEl=null;
  listEl.querySelectorAll('.item[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart',()=>{ dragEl=el; el.classList.add('dragging'); });
    el.addEventListener('dragend',()=>{
      el.classList.remove('dragging'); dragEl=null;
      const ids=[...listEl.querySelectorAll('.item[data-id]')].map(x=>x.dataset.id);
      window.CS.on && window.CS.on.reorder && window.CS.on.reorder(ids);
    });
    el.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragEl||dragEl===el) return;
      const r=el.getBoundingClientRect();
      const before = (e.clientY - r.top) < r.height/2;
      listEl.insertBefore(dragEl, before?el:el.nextSibling);
    });
  });
}

function renderGroups(items){
  const active = items.filter(i=>i.status==='active').sort((a,b)=>(a.position||0)-(b.position||0));
  const box = $('groups');
  if(!active.length){ box.innerHTML=''; }
  else if(viewMode==='flat'){
    box.innerHTML = `<ul class="list" id="flat-list">${active.map(i=>itemRow(i,'active',true)).join('')}</ul>`;
    attachDrag($('flat-list'));
  }else{
    const byCat = {};
    active.forEach(i=>{ (byCat[i.category||'other'] = byCat[i.category||'other']||[]).push(i); });
    box.innerHTML = CS.CAT_ORDER.filter(c=>byCat[c]&&byCat[c].length).map(c=>{
      const meta = CS.CATS[c];
      return `<div class="group"><div class="group-h"><span class="e">${meta.emoji}</span><span>${CS.lang()==='he'?meta.he:meta.en}</span></div>
        <ul class="list">${byCat[c].map(i=>itemRow(i,'active')).join('')}</ul></div>`;
    }).join('');
  }
  $('empty-state').hidden = !!active.length;
  attachSwipe(box);

  const pending = items.filter(i=>i.status==='pending');
  $('pending-box').hidden = !pending.length;
  $('pending-list').innerHTML = pending.map(i=>itemRow(i,'pending')).join('');

  const bought = items.filter(i=>i.status==='checked');
  $('bought-box').hidden = !bought.length;
  $('bought-count').textContent = bought.length;
  $('bought-list').innerHTML = bought.map(i=>itemRow(i,'active')).join('');
  attachSwipe($('bought-list'));
}
$('bought-toggle').addEventListener('click',()=>{ const l=$('bought-list'); l.hidden=!l.hidden; });

/* ---------- auth tabs ---------- */
function setAuthMode(mode){
  $('au-go').dataset.mode = mode;
  $('tab-login').classList.toggle('active',mode==='login');
  $('tab-signup').classList.toggle('active',mode==='signup');
  $('au-name').hidden = mode!=='signup';
  $('au-pass').hidden = mode==='reset';
  $('au-forgot').hidden = mode!=='login';
  paintStrings();
}
$('tab-login').addEventListener('click',()=>setAuthMode('login'));
$('tab-signup').addEventListener('click',()=>setAuthMode('signup'));
$('au-forgot').addEventListener('click',()=>setAuthMode('reset'));

$('lang-btn').addEventListener('click',()=>{ CS.setLang(CS.lang()==='he'?'en':'he'); });

Object.assign(window.CS,{
  $, esc, guess, openSheet, closeSheet, sheetHead, toast,
  setScreen, paintStrings, setAuthMode, renderMembers, renderGroups, initials,
  render(){ paintStrings(); if(window.CS.rerenderMain) window.CS.rerenderMain(); },
});
})();
</script>
