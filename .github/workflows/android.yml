name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        # ubuntu-latest runners ship a pre-installed SDK; Gradle/AGP auto-downloads any
        # missing platform/build-tools pieces once the licenses are accepted.
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cartsync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
