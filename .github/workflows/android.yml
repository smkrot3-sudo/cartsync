name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        # ubuntu-latest runners ship a pre-installed SDK; Gradle/AGP auto-downloads any
        # missing platform/build-tools pieces once the licenses are accepted.
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        # the run number is a free, ever-increasing versionCode — no need to commit a bump
        # back to build.gradle (which would just retrigger this same workflow)
        working-directory: android
        run: gradle assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: cartsync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK + update metadata on the live site
        run: |
          set -e
          mkdir -p docs/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk docs/apk/cartsync-debug.apk
          VNAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          python3 - "${{ github.run_number }}" "$VNAME" <<'PY'
          import json, sys, os
          versioncode, versionname = int(sys.argv[1]), sys.argv[2]
          path = "docs/app-version.json"
          data = {}
          if os.path.exists(path):
              try: data = json.load(open(path, encoding="utf8"))
              except Exception: data = {}
          data["android"] = {
              "versionCode": versioncode, "versionName": versionname,
              "url": "https://smkrot3-sudo.github.io/cartsync/apk/cartsync-debug.apk",
          }
          json.dump(data, open(path, "w", encoding="utf8"), ensure_ascii=False, indent=2)
          PY

      - name: Commit updated APK + version metadata
        # deliberately NOT [skip ci]: docs/ changing here is exactly what should redeploy Pages.
        # Nothing under android/** is touched, so this push won't retrigger this workflow.
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/apk/cartsync-debug.apk docs/app-version.json
          git diff --cached --quiet || git commit -m "ci: publish Android build ${{ github.run_number }}"
          git push
