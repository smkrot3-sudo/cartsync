name: Generate signing keystore (one-time)
on: { workflow_dispatch: {} }
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore cartsync.jks -storetype JKS \
            -alias cartsync -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass cartsync-signing -keypass cartsync-signing \
            -dname "CN=CartSync, OU=CartSync, O=CartSync, L=TelAviv, S=IL, C=IL"
          base64 -w0 cartsync.jks > cartsync.jks.b64
      - uses: actions/upload-artifact@v4
        with:
          name: cartsync-keystore
          path: cartsync.jks.b64
