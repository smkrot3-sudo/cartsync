plugins {
    id "com.android.application"
}

android {
    namespace "il.cartsync.app"
    compileSdk 34

    defaultConfig {
        applicationId "il.cartsync.app"
        minSdk 24
        targetSdk 34
        // CI overrides this with -PappVersionCode=<run number> so it never needs to commit a bump
        // back to this file (which would just retrigger the workflow that pushed it).
        versionCode project.hasProperty("appVersionCode") ? (project.appVersionCode as Integer) : 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.9.2"
}

// kotlin-stdlib-jdk7/jdk8 are folded into kotlin-stdlib since Kotlin 1.8 — an old transitive
// dependency still pulling the split jars collides with AGP's own newer kotlin-stdlib.
configurations.all {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
